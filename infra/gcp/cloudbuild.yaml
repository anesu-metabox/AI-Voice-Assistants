steps:
  # 1. Build the unified backend container image from the repository root
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${BUILD_ID}'
      - '-f'
      - 'Dockerfile'
      - '.'
    id: 'build-image'

  # 2. Push the image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend'
    id: 'push-image'

  # 3. Deploy Credential Broker (Internal, authenticated only)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_PREFIX}-broker'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${BUILD_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--ingress=all'
      - '--command=sh'
      - '--args=-c,python -m uvicorn backend.credential_broker.main:app --host 0.0.0.0 --port $$PORT'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--set-secrets=DATABASE_URL=voice-database-url:latest,CREDENTIAL_BROKER_SHARED_SECRET=voice-broker-secret:latest,GOOGLE_CLIENT_SECRET=voice-google-client-secret:latest,CREDENTIAL_ENCRYPTION_KEY=voice-encryption-key:latest'
      - '--set-env-vars=APP_ENV=production,NEON_BRANCH=production,RUNTIME_DB_ROLE=ai_voice_bot_runtime,CREDENTIAL_KEY_PROVIDER=env,GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}'
    id: 'deploy-broker'

  # 4. Deploy General Voice API (Public HTTPS gateway)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_PREFIX}-api'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${BUILD_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--command=sh'
      - '--args=-c,python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $$PORT'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--set-secrets=DATABASE_URL=voice-database-url:latest,LIVEKIT_API_SECRET=voice-livekit-api-secret:latest,LIVEKIT_SESSION_CONTEXT_SECRET=voice-context-secret:latest,GOOGLE_OAUTH_STATE_SECRET=voice-oauth-state-secret:latest,CREDENTIAL_BROKER_SHARED_SECRET=voice-broker-secret:latest'
      - '--set-env-vars=APP_ENV=production,NEON_BRANCH=production,RUNTIME_DB_ROLE=ai_voice_bot_runtime,LIVEKIT_URL=${_LIVEKIT_URL},LIVEKIT_API_KEY=${_LIVEKIT_API_KEY},GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID},CORS_ORIGINS=${_CORS_ORIGINS}'
    id: 'deploy-api'

  # 5. Deploy Calendar Booking Worker (Background DB poller, CPU always allocated)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_PREFIX}-booking'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${BUILD_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--command=sh'
      - '--args=-c,python -m backend.booking_worker'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--set-secrets=BOOKING_WORKER_DATABASE_URL=voice-booking-database-url:latest,CREDENTIAL_BROKER_SHARED_SECRET=voice-broker-secret:latest'
      - '--set-env-vars=APP_ENV=production,NEON_BRANCH=production,BOOKING_WORKER_DB_ROLE=calendar_booking_worker'
    id: 'deploy-booking'

  # 6. Deploy LiveKit Voice Agent Worker (WebSocket daemon, CPU always allocated)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_PREFIX}-worker'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${BUILD_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--command=sh'
      - '--args=-c,python agent/agent.py start'
      - '--memory=1024Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--set-secrets=GOOGLE_API_KEY=voice-google-api-key:latest,LIVEKIT_API_SECRET=voice-livekit-api-secret:latest,LIVEKIT_SESSION_CONTEXT_SECRET=voice-context-secret:latest'
      - '--set-env-vars=APP_ENV=production,LIVEKIT_URL=${_LIVEKIT_URL},LIVEKIT_API_KEY=${_LIVEKIT_API_KEY},LIVEKIT_AGENT_NAME=calendar-assistant'
    id: 'deploy-worker'

substitutions:
  _REGION: 'us-central1'
  _REPO: 'voice-bot'
  _SERVICE_PREFIX: 'voice'
  _LIVEKIT_URL: 'wss://your-livekit.cloud'
  _LIVEKIT_API_KEY: ''
  _GOOGLE_CLIENT_ID: ''
  _CORS_ORIGINS: '*'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
