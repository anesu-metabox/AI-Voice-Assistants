name: CI Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-and-agent-check:
    name: Backend & Agent Validation (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend & Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r agent/requirements.txt

      - name: Verify Python Compilation & Syntax
        run: |
          python -m py_compile db/connection.py db/idempotency.py db/confirmation.py db/tokens.py db/migrate.py db/run_migrations.py
          python -m py_compile backend/app/config.py backend/app/policy.py backend/app/schemas/tools.py
          python -m py_compile backend/app/services/google_oauth.py backend/app/services/google_calendar.py
          python -m py_compile backend/app/tools/calendar.py backend/app/tools/contacts.py backend/app/tools/email.py backend/app/tools/tasks.py
          python -m py_compile backend/app/api/auth.py backend/app/api/tools.py backend/app/api/tasks.py backend/app/main.py
          python -m py_compile agent/config.py agent/agent.py

  frontend-check:
    name: Frontend TypeScript & Build Check (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

  database-syntax-check:
    name: PostgreSQL DDL Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Migration Files Exist & Non-Empty
        run: |
          test -s db/migrations/001_initial_schema.sql || exit 1
          test -s db/migrations/002_calendar_events.sql || exit 1
          test -s db/migrations/003_oauth_tokens.sql || exit 1
          test -s db/migrations/004_confirmation_tokens.sql || exit 1
